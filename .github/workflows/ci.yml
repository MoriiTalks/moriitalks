name: CI and demo deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A running deployment must finish or roll back before the next one starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code and contracts
        run: pnpm check

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l services/api)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      # Fake providers keep validation deterministic without paid AI calls.
      - name: Check Go races
        run: go -C services/api test -race -count=1 ./...

      - name: Build API
        run: go -C services/api build -o "$RUNNER_TEMP/moriitalks-api" ./cmd/api

      - name: Test release validation and rollback
        run: |
          python3 -m unittest discover -s deploy/server -p 'test_*.py' -v
          bash deploy/scripts/test-release.sh

      # Bundle export checks every platform's JavaScript, native builds remain separate.
      - name: Export mobile bundles
        run: pnpm export:mobile --max-workers 2

      - name: Package immutable demo release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash deploy/scripts/package-release.sh "$RUNNER_TEMP/release"

      - name: Store verified release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    name: Deploy adult demo
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: demo
      url: https://morii.ryutamin.tech
    steps:
      - name: Download this run's verified release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-release
          path: ${{ runner.temp }}/release

      # This key cannot open a shell, forward ports, or alter host configuration.
      - name: Activate release with automatic rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          cd "$RUNNER_TEMP/release"
          shopt -s nullglob
          archives=(*.tar.gz)
          [[ ${#archives[@]} == 1 ]] || { echo 'Expected one release archive' >&2; exit 1; }
          archive=${archives[0]}
          sha256sum -c "$archive.sha256"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $digest" < "$archive"

      - name: Verify HTTPS and the login barrier
        shell: bash
        run: |
          status=$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://morii.ryutamin.tech/v2/device-talk/config)
          [[ "$status" == 401 ]] || { echo "Expected protected HTTPS endpoint, got $status" >&2; exit 1; }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code and contracts
        run: pnpm check

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l services/api)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      # Fake providers keep validation deterministic without paid AI calls.
      - name: Check Go races
        run: go -C services/api test -race -count=1 ./...

      - name: Build API
        run: go -C services/api build -o "$RUNNER_TEMP/moriitalks-api" ./cmd/api

      # Bundle export checks every platform's JavaScript, native builds remain separate.
      - name: Export mobile bundles
        run: pnpm export:mobile --max-workers 2
